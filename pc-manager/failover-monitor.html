<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KC Dual-System Monitor</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#eef2f7}body{margin:0;padding:24px}.wrap{max-width:1180px;margin:auto}.head{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:18px}.head h1{margin:0;font-size:26px}.head small{color:#64748b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid #d7dee8;border-radius:16px;padding:18px;box-shadow:0 3px 14px #10213a0d}.status{display:flex;align-items:center;gap:10px}.lamp{width:15px;height:15px;border-radius:50%;background:#94a3b8;box-shadow:0 0 0 5px #94a3b822}.ok .lamp{background:#16a34a;box-shadow:0 0 0 5px #16a34a22}.warn .lamp{background:#d97706;box-shadow:0 0 0 5px #d9770622}.bad .lamp{background:#dc2626;box-shadow:0 0 0 5px #dc262622}.meta{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px;font-size:14px}.meta span:nth-child(odd){color:#64748b}.flow{grid-column:1/-1}.rail{display:grid;grid-template-columns:1fr 80px 1fr 80px 1fr;align-items:center;text-align:center;margin:20px 0}.node{padding:15px;border:1px solid #d7dee8;border-radius:14px;background:#f8fafc}.line{height:4px;background:#cbd5e1;position:relative;overflow:hidden}.line.active:after{content:"";position:absolute;inset:0;width:35%;background:#16a34a;animation:move 1.2s linear infinite}@keyframes move{from{transform:translateX(-120%)}to{transform:translateX(350%)}}.summary{grid-column:1/-1;display:flex;gap:12px;flex-wrap:wrap}.pill{padding:8px 12px;border-radius:999px;background:#e2e8f0;font-size:13px}.pill.ok{background:#dcfce7}.pill.warn{background:#fef3c7}.pill.bad{background:#fee2e2}button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}#refresh{background:#173765;color:white}@media(max-width:760px){body{padding:12px}.grid{grid-template-columns:1fr}.rail{grid-template-columns:1fr}.line{width:4px;height:35px;margin:auto}.flow,.summary{grid-column:auto}}
</style></head><body><div class="wrap">
<div class="head"><div><h1>KC Dual-System Monitor</h1><small>Cloudflare A · Netlify B · Supabase · Neon · lokaler Notbetrieb</small></div><button id="refresh">Jetzt prüfen</button></div>
<div class="grid">
<section class="card" id="a"><div class="status"><span class="lamp"></span><div><b>Gateway A · Cloudflare</b><div id="aState">Prüfung läuft …</div></div></div><div class="meta" id="aMeta"></div></section>
<section class="card" id="b"><div class="status"><span class="lamp"></span><div><b>Gateway B · Netlify</b><div id="bState">Noch nicht bereitgestellt</div></div></div><div class="meta" id="bMeta"></div></section>
<section class="card flow"><b>Datenweg</b><div class="rail"><div class="node">Kasse<br><small>verschlüsselte IndexedDB</small></div><div class="line" id="line1"></div><div class="node" id="gatewayNode">Gateway A/B</div><div class="line" id="line2"></div><div class="node">Supabase ↔ Neon</div></div></section>
<section class="card summary" id="summary"><span class="pill">Lade Status …</span></section>
</div></div>
<script>
const A='https://kc-failover-gateway.ha-joko.workers.dev',B='https://kc-failover-gateway-b.netlify.app';
const $=id=>document.getElementById(id);function cls(id,state){const n=$(id);n.classList.remove('ok','warn','bad');n.classList.add(state)}
async function probe(url,timeout=6000){const c=new AbortController(),t=setTimeout(()=>c.abort(),timeout),start=performance.now();try{const r=await fetch(url+'/',{cache:'no-store',signal:c.signal});let body={};try{body=await r.json()}catch{}return{ok:r.ok,status:r.status,ms:Math.round(performance.now()-start),body}}catch(e){return{ok:false,error:e.name==='AbortError'?'Timeout':e.message,ms:Math.round(performance.now()-start)}}finally{clearTimeout(t)}}
function renderProvider(id,r){if(r.ok){cls(id,r.body?.status==='DEGRADED'?'warn':'ok');$(id+'State').textContent=r.body?.status||'OK';$(id+'Meta').innerHTML=`<span>Latenz</span><b>${r.ms} ms</b><span>Aktives Backend</span><b>${r.body?.activeBackend||'–'}</b><span>Supabase</span><b>${r.body?.primary?.reachable===true?'OK':r.body?.primary?.reachable===false?'NICHT ERREICHBAR':'–'}</b><span>Neon</span><b>${r.body?.fallback?.reachable===true?'OK':r.body?.fallback?.reachable===false?'NICHT ERREICHBAR':'–'}</b>`}else{cls(id,'bad');$(id+'State').textContent='Nicht erreichbar';$(id+'Meta').innerHTML=`<span>Fehler</span><b>${r.error||r.status||'unbekannt'}</b><span>Versuch</span><b>${r.ms} ms</b>`}}
async function refresh(){const [a,b]=await Promise.all([probe(A),probe(B)]);renderProvider('a',a);renderProvider('b',b);const online=a.ok||b.ok;$('line1').classList.toggle('active',online);$('line2').classList.toggle('active',online);$('gatewayNode').innerHTML=a.ok?'Gateway A aktiv<br><small>Cloudflare</small>':b.ok?'Gateway B aktiv<br><small>Netlify Failover</small>':'Lokaler Notbetrieb<br><small>beide Gateways weg</small>';const pills=[];pills.push(`<span class="pill ${a.ok?'ok':'bad'}">Cloudflare ${a.ok?'GRÜN':'ROT'}</span>`);pills.push(`<span class="pill ${b.ok?'ok':'bad'}">Netlify ${b.ok?'GRÜN':'ROT'}</span>`);const backend=(a.ok?a.body:b.body)?.activeBackend;pills.push(`<span class="pill ${backend==='LOCAL_QUEUE'?'warn':'ok'}">Backend ${backend||'LOKAL'}</span>`);pills.push(`<span class="pill">Letzte Prüfung ${new Date().toLocaleTimeString('de-DE')}</span>`);$('summary').innerHTML=pills.join('')}
$('refresh').onclick=refresh;refresh();setInterval(refresh,15000);
</script></body></html>

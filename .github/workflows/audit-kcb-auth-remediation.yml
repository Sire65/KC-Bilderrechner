          runtime_path=Path('shared/runtime-flags.js')
          runtime=runtime_path.read_text(encoding='utf-8')
          marker="  if(!root.KCCashTransferAuth)parserSync('../cores/cash-transfer-auth-core/cash-transfer-auth-core.js','kcCashTransferAuthBootstrap');\n"
          addition=marker+"  if(!root.KCBExchangeAuth)parserSync('../exchange-core-v31/exchange-auth.js','kcExchangeAuthBootstrap');\n"
          if "kcExchangeAuthBootstrap" not in runtime:
              if marker not in runtime: raise SystemExit('PATCH_MARKER_MISSING: runtime exchange auth')
              runtime=runtime.replace(marker,addition,1)
          runtime_path.write_text(runtime,encoding='utf-8')

          app_path=Path('pos/app.js')
          app=app_path.read_text(encoding='utf-8')
          start=app.find('const POS_EXCHANGE_USED_KEY="kc_pos_exchange_used";')
          end=app.find('el("exportKCExchangeSales").onclick=async()=>{',start)
          if start<0 or end<0: raise SystemExit('PATCH_MARKER_MISSING: KCB exchange block')
          new_block=r'''const POS_EXCHANGE_USED_KEY="kc_pos_exchange_used";
const KCB_EXCHANGE_SECRET_KEY="kc_exchange_secret_v2";
const KCB_EXCHANGE_KEY_ID="markt-2026";
async function exchangeAuthSecret(){
  const vault=window.KCStorageVault;
  if(!vault?.ready||typeof vault.protectedKey!=="function"||!vault.protectedKey(KCB_EXCHANGE_SECRET_KEY))throw new Error("Sicherer Austauschschlüssel-Speicher ist nicht verfügbar");
  await vault.ready;
  const secret=String(localStorage.getItem(KCB_EXCHANGE_SECRET_KEY)||"");
  if(secret.length<32)throw new Error("Austauschschlüssel ist noch nicht sicher provisioniert");
  return secret;
}
async function sealExchangePackage(pkg){
  const auth=window.KCBExchangeAuth;
  if(!auth)throw new Error("KCB-Herkunftsauthentifizierung ist nicht verfügbar");
  const keyId=`${KCB_EXCHANGE_KEY_ID}:${state.master.registerId||"KASSE-01"}`;
  return auth.sign(pkg,{secret:await exchangeAuthSecret(),keyId});
}
async function buildPosExchangeSales(){
  const source={transactions:readTransactions(),trainingTransactions:readTrainingTransactions(),tips:tipRecords(),withdrawals:safeArray(WITHDRAWAL_KEY),discountAudit:safeArray("kc_discount_audit_v020"),cashMovements:JSON.parse(localStorage.getItem("kc_cash_movements")||"[]"),closings:JSON.parse(localStorage.getItem("kc_closings")||"[]")};
  return sealExchangePackage({schema:"KCB-EVENT-1",packageId:crypto.randomUUID(),sourceId:state.master.registerId||"KASSE-01",createdAt:new Date().toISOString(),events:KCBExchange.buildEventPayload(source)});
}
async function buildPosAdminChangeSet(){
  const changes=adminChanges(),changedGroupIds=new Set(),changedArticleIds=new Set(),settingsChanged=changes.some(change=>change.entity==="settings"),displayProfileChanged=changes.some(change=>change.entity==="display-profile");
  changes.forEach(change=>{if(change.entity==="group")changedGroupIds.add(change.entityId);if(change.entity==="article")changedArticleIds.add(change.entityId)});
  const payload=KCBExchange.cleanConfigPayload({groups:GROUPS.filter(group=>changedGroupIds.has(group.id)),articles:PRODUCTS.filter(article=>changedArticleIds.has(article.id)),settings:settingsChanged?state.master:undefined});
  if(displayProfileChanged)payload.settings={...(payload.settings||{}),displayProfile:{buttonSize:displayProfile.buttonSize,buttonMode:displayProfile.buttonMode,showPrice:displayProfile.showPrice}};
  return sealExchangePackage({schema:"KCB-CONFIG-1",packageId:crypto.randomUUID(),createdAt:new Date().toISOString(),validUntil:new Date(Date.now()+30*86400000).toISOString(),targetId:"EXTERNAL-CONFIG",payload});
}
async function validatePosExchange(pkg){
  if(pkg?.format==="KC_EXCHANGE_PACKAGE")return ["Unsicheres Legacy-Austauschpaket ohne kryptografische Herkunftsprüfung ist gesperrt"];
  const errors=KCBExchange.validateEnvelope(pkg,["KCB-CONFIG-1","KCB-EVENT-1"]);
  const auth=window.KCBExchangeAuth;
  if(!auth){errors.push("KCB-Herkunftsauthentifizierung nicht verfügbar");return errors}
  let secret;try{secret=await exchangeAuthSecret()}catch(error){errors.push(error.message||"Austauschschlüssel nicht verfügbar");return errors}
  const verification=await auth.verify(pkg,{secret,allowedSchemas:["KCB-CONFIG-1","KCB-EVENT-1"],now:Date.now()});
  if(!verification.ok)errors.push(`Kryptografische Herkunftsprüfung fehlgeschlagen (${verification.code})`);
  const used=JSON.parse(localStorage.getItem(POS_EXCHANGE_USED_KEY)||"[]");if(used.includes(pkg?.packageId))errors.push("Paket bereits importiert");
  return errors;
}
'''

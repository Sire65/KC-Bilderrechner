          runtime_test=runtime_test_path.read_text(encoding='utf-8')
          marker="assert.match(source,/cash-transfer-auth-core\\.js/,'KCASH2-Authentifizierungs-Bootstrap fehlt.');\n"
          if "KCB-Austausch-Authentifizierungs-Bootstrap fehlt" not in runtime_test:
              if marker not in runtime_test: raise SystemExit('PATCH_MARKER_MISSING: runtime test')

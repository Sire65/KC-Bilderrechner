              wf=wf.replace("          node --check cores/cash-transfer-auth-core/cash-transfer-auth-core.js\n","          node --check cores/cash-transfer-auth-core/cash-transfer-auth-core.js\n          node --check exchange-core-v31/exchange-auth.js\n",1)
              wf=wf.replace("          node --check tests/cash-transfer-auth-core.test.cjs\n","          node --check tests/cash-transfer-auth-core.test.cjs\n          node --check tests/exchange-auth-core.test.cjs\n",1)
              wf=wf.replace("      - name: KCASH2 authenticity regression\n        run: node tests/cash-transfer-auth-core.test.cjs\n","      - name: KCASH2 authenticity regression\n        run: node tests/cash-transfer-auth-core.test.cjs\n      - name: KCB exchange authenticity regression\n        run: node tests/exchange-auth-core.test.cjs\n",1)
          wf_path.write_text(wf,encoding='utf-8')

          gate_path=Path('tests/tuv-security-release-gate.test.cjs')
          gate=gate_path.read_text(encoding='utf-8')
          old="if (/KCB-CHECK-1/.test(app) && !/(HMAC|subtle\\.verify|signature)/i.test(around(app, 'function validatePosExchange', 7000))) {\n  warnings.push('KCB-Konfigurations-/Austauschpakete nutzen eine Prüfsumme statt kryptografischer Herkunftsprüfung. Signatur/HMAC für vertrauenswürdige Manager-Pakete vorsehen.');\n}\n"
          new="const exchangeAuthSource=read('exchange-core-v31/exchange-auth.js');\nconst exchangeArea=around(app, 'const KCB_EXCHANGE_SECRET_KEY', 14000);\nconst exchangeAuthenticated=/KCB-Herkunftsauthentifizierung/.test(exchangeArea)&&/exchangeAuthSecret/.test(exchangeArea)&&/await auth\\.verify/.test(exchangeArea)&&/KCB_EXCHANGE_SECRET_KEY\\s*=\\s*[\"']kc_exchange_secret_v2[\"']/.test(exchangeArea)&&/KCB-HMAC-SHA256-1/.test(exchangeAuthSource)&&/subtle\\.verify/.test(exchangeAuthSource);\nif(!exchangeAuthenticated)blockers.push('KCB-Konfigurations-/Austauschpakete sind nicht vollständig kryptografisch authentifiziert und fail-closed angebunden.');\n"
          if old not in gate: raise SystemExit('PATCH_MARKER_MISSING: KCB gate warning')
          gate=gate.replace(old,new,1)

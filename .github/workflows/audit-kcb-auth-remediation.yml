          replacements={
            'const pkg=buildPosExchangeSales();':'const pkg=await buildPosExchangeSales();',
            'const pkg=buildPosAdminChangeSet();':'const pkg=await buildPosAdminChangeSet();',
            'const errors=validatePosExchange(pkg);if(errors.length)':'const errors=await validatePosExchange(pkg);if(errors.length)'
          }

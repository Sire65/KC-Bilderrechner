          old_bullet='- `KCB-CHECK-1` schützt Austausch-/Konfigurationspakete weiterhin nur mit einer Prüfsumme statt einer kryptografischen Herkunftsprüfung. Für vertrauenswürdige Manager-Pakete ist Signatur oder HMAC vorzusehen.\n'
          if old_bullet in doc: doc=doc.replace(old_bullet,'',1)
          anchor='## Bereits eingeführte und getestete Abhilfe auf der Audit-Spur\n\n'
          addition='- `KCBExchangeAuth` V1.0.0 authentifiziert `KCB-CONFIG-1` und `KCB-EVENT-1` mit HMAC-SHA-256 (`KCB-HMAC-SHA256-1`). Manipulierte, abgelaufene und checksum-only Legacy-Pakete werden fail-closed abgelehnt. Der Schlüssel `kc_exchange_secret_v2` muss vor Rollout pro Sicherheitskonzept im Local Vault provisioniert und mit dem externen Manager abgestimmt werden. Regression: `tests/exchange-auth-core.test.cjs`.\n'
          if 'KCBExchangeAuth` V1.0.0' not in doc:
              if anchor not in doc: raise SystemExit('PATCH_MARKER_MISSING: remediation doc')
              doc=doc.replace(anchor,anchor+addition,1)

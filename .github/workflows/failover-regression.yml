name: KC Failover Regression

on:
  push:
    branches: [main]
    paths:
      - 'cores/notification-core/notification-core.js'
      - 'cores/audit-core/audit-core.js'
      - 'cores/health-core/health-core.js'
      - 'cores/security-core/security-core.js'
      - 'cores/security-core/crypto-secure-sync.js'
      - 'pc-manager/failover-monitor.html'
      - 'pos/app.js'
      - 'pos/index.html'
      - 'pos/local-vault-bootstrap.js'
      - 'pos/dual-gateway-bootstrap.js'
      - 'pos/service-worker.js'
      - 'tests/failover-sync.test.cjs'
      - 'tests/local-vault.test.cjs'
      - 'tests/dual-gateway.test.cjs'
      - 'tests/audit-core-redaction.test.cjs'
      - 'tests/health-core-redaction.test.cjs'
      - 'tests/secure-sync-envelope.test.cjs'
      - 'tests/failover-monitor-xss.test.cjs'
      - 'tests/tuv-security-release-gate.test.cjs'
      - '.github/workflows/failover-regression.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  failover-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check cores/notification-core/notification-core.js
          node --check cores/audit-core/audit-core.js
          node --check cores/health-core/health-core.js
          node --check cores/security-core/security-core.js
          node --check cores/security-core/crypto-secure-sync.js
          node --check pos/local-vault-bootstrap.js
          node --check pos/dual-gateway-bootstrap.js
          node --check pos/service-worker.js
          node --check tests/audit-core-redaction.test.cjs
          node --check tests/health-core-redaction.test.cjs
          node --check tests/secure-sync-envelope.test.cjs
          node --check tests/failover-monitor-xss.test.cjs
          node --check tests/tuv-security-release-gate.test.cjs
      - name: AuditCore secret redaction regression
        run: node tests/audit-core-redaction.test.cjs
      - name: HealthCore diagnostic redaction regression
        run: node tests/health-core-redaction.test.cjs
      - name: Secure Sync envelope regression
        run: node tests/secure-sync-envelope.test.cjs
      - name: Failover monitor XSS regression
        run: node tests/failover-monitor-xss.test.cjs
      - name: Install test dependency
        run: npm install --no-save fake-indexeddb@6.2.2
      - name: Encrypted Local Vault regression
        run: node tests/local-vault.test.cjs
      - name: Dual gateway A/B regression
        run: node tests/dual-gateway.test.cjs
      - name: Offline queue / replay / reconcile / conflict regression
        run: node tests/failover-sync.test.cjs
      - name: TÜV security release gate
        run: node tests/tuv-security-release-gate.test.cjs

name: Audit KCB Exchange Auth Launcher

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  launch:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'audit/tuv-hardening-2026-08-18'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch isolated KCB remediation
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'audit-kcb-auth-remediation.yml',
              ref: 'audit/tuv-hardening-2026-08-18'
            });

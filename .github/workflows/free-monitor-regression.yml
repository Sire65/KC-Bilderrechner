name: KC Free-Monitor Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'pc-manager/free-monitor.html'
      - 'pc-manager/free-monitor-core.js'
      - 'pc-manager/failover-monitor.html'
      - 'tests/free-monitor-core.test.cjs'
      - '.github/workflows/free-monitor-regression.yml'
  workflow_dispatch:

concurrency:
  group: kc-free-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  free-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check pc-manager/free-monitor-core.js
          node --check tests/free-monitor-core.test.cjs
      - name: Free-Monitor zero-credit regression
        run: node tests/free-monitor-core.test.cjs

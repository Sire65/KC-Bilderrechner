<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KC Communication Push-Test</title><style>body{font-family:system-ui;background:#f5f5f5;margin:0;padding:24px;color:#222}.card{max-width:560px;margin:40px auto;background:#fff;border-radius:18px;padding:24px;box-shadow:0 6px 22px #0002}h1{margin-top:0}.btn{width:100%;padding:16px;border:0;border-radius:12px;background:#a7192d;color:white;font-size:18px;font-weight:700}.msg{margin-top:18px;padding:14px;border-radius:10px;background:#eef2f5}.ok{background:#e6f5ea}.err{background:#fdeaea}</style></head><body><div class="card"><h1>KC Communication</h1><p>Einmaliger Push-Test für dieses Gerät.</p><button class="btn" id="go">Push anmelden und testen</button><div id="m" class="msg">Bereit.</div></div><script>const q=new URLSearchParams(location.search),token=q.get('t')||'',API='https://ptblnpiroqftcvlsrhac.supabase.co/functions/v1/kc-communication-push-test-register';const m=document.getElementById('m'),go=document.getElementById('go');function b64(s){const p='='.repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))}go.onclick=async()=>{go.disabled=true;try{if(!token)throw Error('Testlink unvollständig.');if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window))throw Error('Web Push wird auf diesem Browser nicht unterstützt.');let p=Notification.permission==='granted'?'granted':await Notification.requestPermission();if(p!=='granted')throw Error('Benachrichtigungen wurden nicht erlaubt.');m.textContent='Gerät wird registriert…';const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./'});await navigator.serviceWorker.ready;const c=await fetch(API+'?config=1&t='+encodeURIComponent(token),{cache:'no-store'}).then(r=>r.json());if(!c.ok)throw Error(c.error||'Konfiguration fehlt');let sub=await reg.pushManager.getSubscription();if(sub){try{await sub.unsubscribe()}catch{}}sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(c.vapidPublicKey)});const r=await fetch(API+'?t='+encodeURIComponent(token),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subscription:sub.toJSON(),userAgent:navigator.userAgent})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Push-Test fehlgeschlagen');m.className='msg ok';m.textContent='✓ Gerät registriert. Test-Push wurde gesendet.'}catch(e){m.className='msg err';m.textContent='Fehler: '+e.message;go.disabled=false}};</script></body></html>
